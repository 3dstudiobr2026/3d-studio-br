
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Administração | 3D Studio BR</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #070b13; }
    iframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
    }
  </style>
</head>
<body>
  <iframe
    id="painel"
    src="./index.html"
    title="Painel administrativo da 3D Studio BR">
  </iframe>

  <script>
    document.getElementById('painel').addEventListener('load', function () {
      const pagina = this.contentWindow;
      if (typeof pagina.showAdmin === 'function') {
        pagina.showAdmin();
      }
    });
  </script>
</body>
</html>
